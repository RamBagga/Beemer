# Repo-root config: Streamlit Community Cloud only reads .streamlit/config.toml at the repo root,
# and every launcher (start.sh, Docker, Render, Makefile) runs `streamlit run app/main.py` from the root.
# Port/address are passed on the command line (PORT env on hosts; 127.0.0.1 locally via start.sh).
[server]
headless = true
enableStaticServing = true   # serves app/static at /app/static

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"

[theme]
# Light ("Studio") is the default; dark ("Night") via the Studio / Night switch in the menu drawer.
# Tokens mirror app/beemer.py PALETTES and design/beemer-design-board.md.
base = "light"
baseRadius = "10px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
headingFont = "'Inter Tight':https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap"
primaryColor = "#2D6BFF"
backgroundColor = "#F5F7FB"
secondaryBackgroundColor = "#F0F3F8"
textColor = "#0A1022"
linkColor = "#2563C9"
borderColor = "#E2E7EF"
dataframeHeaderBackgroundColor = "#F4F6FA"
chartCategoricalColors = ["#2D6BFF", "#7466E8", "#1F9E9A", "#BF842C", "#D2566B", "#2563C9"]

[theme.sidebar]
backgroundColor = "#FBFCFE"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#283145"
borderColor = "#E2E7EF"

[theme.light]
primaryColor = "#2D6BFF"
backgroundColor = "#F5F7FB"
secondaryBackgroundColor = "#F0F3F8"
textColor = "#0A1022"
linkColor = "#2563C9"
borderColor = "#E2E7EF"
dataframeHeaderBackgroundColor = "#F4F6FA"
chartCategoricalColors = ["#2D6BFF", "#7466E8", "#1F9E9A", "#BF842C", "#D2566B", "#2563C9"]

[theme.light.sidebar]
backgroundColor = "#FBFCFE"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#283145"
borderColor = "#E2E7EF"

[theme.dark]
primaryColor = "#5B8CFF"
backgroundColor = "#06080E"
secondaryBackgroundColor = "#121926"
textColor = "#EAEFF7"
linkColor = "#7DB8FF"
borderColor = "#1C2433"
dataframeHeaderBackgroundColor = "#0C111B"
chartCategoricalColors = ["#5B8CFF", "#A08FFF", "#4CC3BC", "#E3AE52", "#EE6F82", "#7DB8FF"]

[theme.dark.sidebar]
backgroundColor = "#0A0E17"
secondaryBackgroundColor = "#121926"
textColor = "#C3CBD9"
borderColor = "#1C2433"

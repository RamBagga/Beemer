# Render Blueprint — free web service (New + → Blueprint → pick this repo).
# Free plan: 512 MB RAM / 0.1 CPU, sleeps after 15 min idle (~1 min to wake), 750 instance-hours/month.
services:
  - type: web
    name: beemer
    runtime: python            # Python version comes from .python-version (3.12)
    plan: free
    region: singapore          # closest Render region to India
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python bootstrap.py || true; streamlit run app/main.py --server.port $PORT --server.address 0.0.0.0
    healthCheckPath: /_stcore/health
    envVars:
      - key: BEEMER_DATA_REPO
        value: RamBagga/Beemer
      - key: BEEMER_DATA_MAX_AGE_HOURS
        value: "6"
      - key: BEEMER_BOOTSTRAP_FALLBACK
        value: prices

# Rebuilds Beemer's market data on GitHub's servers and publishes it to the rolling
# `data-latest` release, which deployed apps download (bootstrap.py). No secrets needed.
name: Update data

on:
  schedule:
    - cron: "15 10 * * 1-5"   # 15:45 IST - market-close snapshot (prices only)
    - cron: "0 13 * * 1-5"    # 18:30 IST - end of day (prices + weekly fundamentals refresh)
  workflow_dispatch:
    inputs:
      mode:
        description: "eod = prices + stale fundamentals · snapshot = prices only · full = force-refresh all fundamentals"
        type: choice
        options: [eod, snapshot, full]
        default: eod

permissions:
  contents: write   # create / update the data-latest release

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Kolkata
      BEEMER_FUND_MAX_FAILS: "5"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore the last published data (incremental update)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python bootstrap.py --download-only || echo "::notice::No published data yet - building from scratch"

      - name: Update data
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "15 10 * * 1-5" ]; then MODE=snapshot; else MODE=eod; fi
          fi
          case "$MODE" in
            snapshot) ARGS="--prices-only" ;;
            full)     ARGS="--force-fund" ;;
            *)        ARGS="" ;;
          esac
          echo "mode=$MODE args=$ARGS"
          python update_data.py $ARGS 2>&1 | tee update.log
          if grep -q "likely blocked" update.log; then
            echo "::warning::screener.in refused requests from the runner - published data keeps the previous fundamentals"
          fi

      - name: Validate
        run: python bootstrap.py --check

      - name: Publish to the data-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_data.sh

      - name: Summary
        run: |
          echo "### Beemer data published" >> "$GITHUB_STEP_SUMMARY"
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sqlite3
          c = sqlite3.connect("data/market.db")
          q = lambda s: c.execute(s).fetchone()[0]
          last = q("SELECT MAX(date) FROM prices WHERE symbol NOT LIKE '^%'")
          print(f"- last price date: **{last}**")
          print(f"- price rows: {q('SELECT COUNT(*) FROM prices'):,}")
          print(f"- fundamentals rows: {q('SELECT COUNT(*) FROM fundamentals'):,} (newest fetch {q('SELECT MAX(fetched_at) FROM fund_meta')})")
          PY

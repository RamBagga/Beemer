name: Spring + React

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "screenshots/**", "design/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit tests
        working-directory: backend
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: API for the smoke test
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Playwright smoke against the API
        env:
          BEEMER_BOOTSTRAP_FALLBACK: none
          BEEMER_DATA_DIR: ${{ github.workspace }}/data
          BEEMER_WEB: http://127.0.0.1:4173
        run: |
          mvn -B -q -DskipTests -f backend/pom.xml package
          java -jar backend/target/beemer-api-1.0.0.jar &
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8080/actuator/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/actuator/health
          (cd frontend && npm run preview -- --host 127.0.0.1 --port 4173) &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          cd frontend && npx playwright test

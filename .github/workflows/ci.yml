# On every push / PR: install on the hosting Python version, load the published data the
# same way a fresh cloud deployment does, render every page headlessly, and check the
# server's health endpoint.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "screenshots/**", "design/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bootstrap data like a fresh deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python bootstrap.py
      - name: Render every page
        run: python scripts/smoke_test.py
      - name: Server health check
        run: |
          streamlit run app/main.py --server.port 8501 --server.address 127.0.0.1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8501/_stcore/health && exit 0; sleep 1; done
          exit 1

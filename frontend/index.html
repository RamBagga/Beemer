<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      try {
        var chosen = localStorage.getItem("beemer-theme");
        if (!chosen) { chosen = "Light"; localStorage.setItem("beemer-theme", chosen); }
        document.documentElement.dataset.theme = chosen === "Dark" ? "dark" : "light";
      } catch (e) {}
    </script>
    <title>Beemer · Precision research for India tech</title>
    <link rel="icon" href="/beemer-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
